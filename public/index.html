<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatGPT Plan Test</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="card">
      <p class="eyebrow">Open-source OAuth proof of concept</p>
      <h1>ChatGPT Plan Test</h1>
      <p class="lede">
        Sign in with your ChatGPT account, load the models available to that account,
        then make a Responses API request using your authorised ChatGPT plan.
      </p>

      <div id="signed-out">
        <a class="primary" href="/auth/start">Continue with ChatGPT</a>
      </div>

      <div id="signed-in" hidden>
        <div class="account">
          <img id="avatar" alt="" hidden />
          <div>
            <strong id="account-name">Connected</strong>
            <span id="account-email"></span>
          </div>
          <button id="signout" class="ghost">Sign out</button>
        </div>

        <label for="model">Model</label>
        <select id="model"></select>

        <label for="prompt">Prompt</label>
        <textarea id="prompt" rows="6">Say exactly: Hello from my ChatGPT subscription!</textarea>

        <button id="send" class="primary">Send with my ChatGPT plan</button>

        <div class="output-wrap">
          <div class="output-label">Response</div>
          <pre id="output">Nothing sent yet.</pre>
        </div>
      </div>

      <p id="status" class="status"></p>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
